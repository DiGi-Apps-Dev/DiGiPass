<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DiGiPass</title>
<link rel="stylesheet" href="/risorse/stile.css">
<link rel="icon" type="image/svg+xml" href="/risorse/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/risorse/favicon-32.png">
<link rel="apple-touch-icon" href="/risorse/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#141317">
<script src="/vendor/argon2.js"></script>
<script type="module" src="/risorse/app.js"></script>
</head>
<body>
<!-- Barra identica a DiGiShare (public/pannello.html): simbolo, scritta coi puntini, Cerca, Blocca ed Esci (Impostazioni sta nel menu laterale). -->
<header class="barra">
  <img class="logo" src="/risorse/logo.svg" alt="" width="34" height="34">
  <span class="marchio" aria-label="DiGiPass">D<span class="punto rosso">ı</span>G<span class="punto giallo">ı</span>Pass</span>
  <label class="cerca cerca-barra" id="cercaBarra" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="cerca" type="search" placeholder="Cerca…" aria-label="Cerca" autocomplete="off">
    <button id="cercaX" class="cercax" type="button" title="Cancella" aria-label="Cancella la ricerca" hidden>×</button>
  </label>
  <span class="distanza"></span>
  <button class="azione-barra" id="blocca" type="button" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Blocca
  </button>
  <button class="azione-barra" id="esciBarra" type="button" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg>Esci
  </button>
</header>
<main id="vista"></main>
<div id="avviso" class="avviso" hidden></div>
</body>
</html>
